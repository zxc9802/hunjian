<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材库 · 向量化进度</title>
<style>
:root{--paper:#f5f4ee;--white:#fff;--ink:#20362f;--muted:#697b73;--green:#24664e;--wash:#e7eee7;--line:#d9e1d7;--warn:#a84928}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 "Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:34px 30px 50px}nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;gap:16px}.brand{letter-spacing:2px;font-size:12px}a{color:var(--green);text-underline-offset:4px}a:focus-visible{outline:2px solid var(--green);outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;gap:22px;margin:34px 0 24px}h1{font-size:30px;margin:0 0 5px;letter-spacing:-1px}p{margin:0;color:var(--muted)}.badge{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--green);background:var(--wash);border-radius:20px;padding:7px 13px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.warn{color:var(--warn)!important}#notice{padding:12px 16px;background:#fff2e8;border-left:3px solid var(--warn);margin-bottom:20px}#notice[hidden]{display:none}.summary{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:26px 28px}.progress-head{display:flex;justify-content:space-between;align-items:end;gap:18px}.eyebrow{font-size:12px;color:var(--muted)}.big{font:46px/1.2 Consolas,monospace;letter-spacing:-2px}.denom{font-size:20px;color:var(--muted);letter-spacing:0}.percent{font:25px Consolas,monospace;color:var(--green)}.track{height:10px;background:var(--wash);border-radius:10px;overflow:hidden;margin:20px 0 10px}.fill{height:100%;width:0;background:var(--green);transition:width .5s}.progress-note{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:25px;padding-top:20px;border-top:1px solid var(--line);gap:18px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font:23px/1.8 Consolas,"Microsoft YaHei",sans-serif;font-weight:500}.metric small{font-size:12px;color:var(--muted)}.steps{display:flex;gap:8px;margin:20px 0 28px}.step{flex:1;padding:12px 16px;border-bottom:3px solid var(--line);font-size:12px;color:var(--muted)}.step.on{border-color:var(--green);color:var(--green)}.step b{margin-right:6px}.content{display:grid;grid-template-columns:1fr 1fr;gap:30px}h2{font-size:16px;margin:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title small{font-size:11px;color:var(--muted)}.list{max-height:535px;overflow-y:auto;background:var(--white);border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{padding:11px 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row-top{display:flex;justify-content:space-between;gap:10px;font-size:12px}.name{overflow-wrap:anywhere}.time{font:12px/1.7 Consolas,monospace;white-space:nowrap;color:var(--green)}.path{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}.empty{padding:25px 16px;font-size:12px;color:var(--muted)}details{margin-top:24px;color:var(--muted);font-size:12px}summary{cursor:pointer}#errors{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;color:var(--warn)}footer{font-size:11px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted)}footer p+p{margin-top:5px}@media(max-width:760px){main{padding:20px 18px}header{align-items:flex-start;margin:25px 0 20px}h1{font-size:24px}.summary{padding:20px}.big{font-size:38px}.content{grid-template-columns:1fr;gap:24px}.metrics{grid-template-columns:1fr 1fr;gap:14px}.steps{gap:2px}.step{padding:10px 6px;font-size:11px}.progress-note{flex-direction:column;gap:3px}.brand{letter-spacing:0}nav{font-size:12px}.badge{padding:5px 9px;font-size:11px}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
<main>
<nav><span class="brand">海南康养 / 素材库</span><a href="http://127.0.0.1:8765/">返回视频工作台 ↗</a></nav>
<header><div><h1>向量化进度</h1><p>每秒 1 帧，逐段建立可检索的素材库。</p></div><div class="badge" id="badge"><i class="dot"></i><span id="state" role="status">连接中</span></div></header>
<div id="notice" role="alert" hidden></div>
<section class="summary" aria-label="总体进度">
<div class="progress-head"><div><div class="eyebrow">已入库片段 / 全部片段</div><div class="big"><span id="done">—</span><span class="denom"> / <span id="total">—</span></span></div></div><div class="percent" id="percent">—</div></div>
<div class="track" id="bar" role="progressbar" aria-label="片段入库进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
<div class="progress-note"><span id="description">正在读取处理记录…</span><span id="refresh">每 2 秒自动更新</span></div>
<div class="metrics"><div class="metric"><span>完整处理的视频</span><b id="videos">—</b></div><div class="metric"><span>待重试片段</span><b id="failed">—</b></div><div class="metric"><span>平均处理速度</span><b id="rate">—</b> <small>段/分钟</small></div><div class="metric"><span>预计还需</span><b id="eta">计算中</b></div></div>
</section>
<div class="steps" aria-label="处理阶段"><div class="step" id="scan"><b>01</b> 盘点素材</div><div class="step" id="embed"><b>02</b> 抽帧 · 向量入库</div><div class="step" id="verify"><b>03</b> 校验 · 启用 FAISS</div></div>
<div class="content"><section><div class="section-title"><h2>正在处理</h2><small id="workers">—</small></div><div class="list" id="active"><div class="empty">等待读取任务</div></div></section><section><div class="section-title"><h2>最近入库</h2><small>最新记录在前</small></div><div class="list" id="recent"><div class="empty">还没有完成记录</div></div></section></div>
<details id="errorDetails" hidden><summary id="errorSummary">失败记录</summary><pre id="errors"></pre></details>
<footer><p id="source">素材来源：Z 盘 · 海南康养素材库</p><p>每 8 秒一个向量片段，短片保留整段。入库包含视频向量与画面描述；全部完成后校验并启用全量 FAISS 索引。预计时间随接口速度变化。</p><p id="elapsed"></p></footer>
</main>
<script>
const $=id=>document.getElementById(id), states={waiting:'等待启动',scanning:'盘点中',running:'正在向量化',verifying:'正在校验',complete:'全量索引已启用',incomplete:'存在未完成片段',failed:'处理已中断'};
function duration(s){if(s==null||!Number.isFinite(s))return '计算中';if(s<60)return '不到 1 分钟';const m=Math.ceil(s/60);return m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+m%60+' 分钟'}
function clock(t){return new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false})}
function row(item,recent){const row=document.createElement('div');row.className='row';const top=document.createElement('div');top.className='row-top';const name=document.createElement('span');name.className='name';const parts=item.path.replaceAll('\\','/').split('/');name.textContent=parts.pop();const stamp=document.createElement('span');stamp.className='time';stamp.textContent=recent?clock(item.time):item.start.toFixed(1)+'–'+item.end.toFixed(1)+'s';top.append(name,stamp);const sub=document.createElement('div');sub.className='path';sub.textContent=parts.slice(-2).join(' / ')+(recent?' · '+item.start.toFixed(1)+'s 起 · 用时 '+Math.round(item.seconds)+'s':'');row.append(top,sub);return row}
function list(id,items,isRecent,empty){const box=$(id);if(items.length)box.replaceChildren(...items.map(x=>row(x,isRecent)));else{const e=document.createElement('div');e.className='empty';e.textContent=empty;box.replaceChildren(e)}}
async function poll(){try{const r=await fetch('/api/progress',{cache:'no-store'});if(!r.ok)throw Error('进度读取失败，正在自动重连。');const s=await r.json(), done=s.completed_clips||0,total=s.total_clips||0,pct=total?Math.min(100,done/total*100):0,ended=['complete','incomplete','failed'].includes(s.state);$('state').textContent=s.stale?'进度暂未更新':(states[s.state]||s.state);$('badge').classList.toggle('warn',s.stale||['failed','incomplete'].includes(s.state));$('done').textContent=done.toLocaleString();$('total').textContent=total?total.toLocaleString():'—';$('percent').textContent=pct.toFixed(1)+'%';$('fill').style.width=pct+'%';$('bar').setAttribute('aria-valuenow',pct.toFixed(1));$('videos').textContent=(s.completed_videos||0)+' / '+(s.total_videos||'—');$('failed').textContent=s.failed_clips||0;$('failed').classList.toggle('warn',s.failed_clips>0);$('rate').textContent=(s.clips_per_minute||0).toFixed(1);$('eta').textContent=s.state==='complete'?'已完成':ended?'未完成':s.stale?'暂不可估算':s.elapsed_seconds<120?'计算中':duration(s.eta_seconds);$('description').textContent=s.state==='complete'?'全部片段已校验，匹配任务将使用全量索引。':s.state==='verifying'?'正在校验素材覆盖与 FAISS 索引。':`已保存 ${done} 条向量及画面描述${s.round===2?' · 正在重试失败片段':''}`;$('refresh').textContent=s.updated_at?'更新于 '+clock(s.updated_at)+' · 每 2 秒刷新':'每 2 秒自动更新';$('workers').textContent=(s.active||[]).length+' / '+(s.workers||8)+' 个处理任务';list('active',s.active||[],false,ended?'当前没有处理中的片段':'等待分配片段…');list('recent',(s.recent||[]).filter(x=>x.status==='ok').reverse().slice(0,8),true,'首批完成后，记录会显示在这里。');$('scan').classList.toggle('on',!!s.total_videos);$('embed').classList.toggle('on',['running','verifying','complete','incomplete'].includes(s.state));$('verify').classList.toggle('on',['verifying','complete'].includes(s.state));const errors=s.errors||[];$('errorDetails').hidden=!errors.length;$('errorSummary').textContent='查看失败记录（'+errors.length+' 条，含已重试记录）';$('errors').textContent=errors.slice().reverse().map(e=>clock(e.time)+' · '+e.path+' @ '+e.start+'s\n'+e.error).join('\n\n');$('source').textContent='素材来源：'+(s.root||'Z 盘 · 海南康养素材库');$('elapsed').textContent=s.started_at?'本轮启动 '+new Date(s.started_at*1000).toLocaleString('zh-CN',{hour12:false})+' · 已运行 '+duration(s.elapsed_seconds)+(s.resumed_clips?' · 复用 '+s.resumed_clips+' 条已完成记录':''):'';const warning=s.fatal_error?'中断原因：'+s.fatal_error:s.stale?'任务已超过 20 秒没有更新。保留已入库数据，请检查后台进程。':s.state==='incomplete'?'部分素材尚未完成，全量索引尚未启用。请查看失败记录后续建。':'';$('notice').hidden=!warning;$('notice').textContent=warning}catch(e){$('state').textContent='连接中断';$('badge').classList.add('warn');$('notice').hidden=false;$('notice').textContent=e.message||'本地看板服务连接中断，正在自动重连。'}finally{setTimeout(poll,2000)}}poll();
</script>
</html>
